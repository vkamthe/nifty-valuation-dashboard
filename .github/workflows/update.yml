name: Update index data

on:
  schedule:
    # 13:00 UTC = 18:30 IST, weekdays (after NSE close at 15:30 IST).
    # GitHub cron is UTC and can lag a few minutes under load.
    - cron: "0 13 * * 1-5"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write         # required so the job can commit data.json

concurrency:
  group: update-index-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest index values
        run: python fetch.py

      - name: Commit updated data.json
        run: |
          git config user.name  "data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "chore: nightly index update" || echo "No changes to commit"
          git push
